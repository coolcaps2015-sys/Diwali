<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PURV Diwali Wishes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&family=Poppins:wght@300;400;500&display=swap">
<style>
/* Layout: one full-bleed night scene. Stage 1 is a lone time bomb on black; stage 2 is a Diwali night with logo card, wish text, bulb string, diyas and live fireworks. */
:root{
  --ink:#07040c;
  --ink-2:#120a1c;
  --ember:#ff8a1f;
  --gold:#ffd166;
  --flame:#ff3b2e;
  --cream:#ffe9c7;
  --rose:#ff5fa2;
  --font-display:'Cinzel Decorative','Trajan Pro',Georgia,serif;
  --font-body:'Poppins','Segoe UI',system-ui,sans-serif;
  --font-lcd:'Orbitron','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{
  margin:0;min-height:100svh;color:var(--cream);font-family:var(--font-body);
  overflow-x:hidden;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
.scene{
  position:relative;z-index:3;
  min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:grid;place-items:center;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#bgGlow{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 2s ease 0.4s;
  background:
    radial-gradient(ellipse 70% 45% at 50% 108%,rgba(255,130,20,.38),transparent 70%),
    radial-gradient(ellipse 60% 50% at 50% 30%,rgba(120,40,160,.22),transparent 70%),
    linear-gradient(#0a0512,#12071a 60%,#1a0a14);}
body.lit #bgGlow{opacity:1}
#alarm{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(255,30,20,.5) 100%)}
#flash{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
#flash.go{opacity:1;transition:none}
#flash.fade{opacity:0;transition:opacity 1.1s ease-out}

/* ---------- Stage 1 : bomb ---------- */
#stage1{gap:28px;align-content:center;justify-items:center;transition:opacity .7s ease}
#stage1.gone{opacity:0;pointer-events:none}
#bombWrap{width:min(320px,74vw);will-change:transform,filter}
#bombWrap svg{width:100%;height:auto;display:block;overflow:visible}
#bombWrap.boomed{opacity:0;transform:scale(1.5);transition:opacity .18s ease-out,transform .18s ease-out}
#startBtn{
  appearance:none;border:1px solid rgba(255,138,31,.7);background:linear-gradient(180deg,rgba(255,138,31,.18),rgba(255,59,46,.1));
  color:var(--gold);font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:14px;
  padding:15px 34px;border-radius:999px;cursor:pointer;
  box-shadow:0 0 0 0 rgba(255,138,31,.5),0 0 26px rgba(255,138,31,.25);
  animation:btnPulse 2.2s ease-out infinite;transition:opacity .4s ease,transform .2s ease;
}
#startBtn:hover{transform:translateY(-1px);background:linear-gradient(180deg,rgba(255,138,31,.3),rgba(255,59,46,.18))}
#startBtn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#startBtn.off{opacity:0;pointer-events:none;animation:none}
@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(255,138,31,.45),0 0 26px rgba(255,138,31,.25)}80%,100%{box-shadow:0 0 0 18px rgba(255,138,31,0),0 0 26px rgba(255,138,31,.25)}}
.led{animation:ledIdle 1.6s steps(2,end) infinite}
.running .led{animation:ledFast .5s steps(2,end) infinite}
@keyframes ledIdle{50%{opacity:.25}}
@keyframes ledFast{50%{opacity:.15}}

/* shockwave */
.shock{position:fixed;z-index:19;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  border:6px solid rgba(255,220,150,.95);box-shadow:0 0 60px 20px rgba(255,150,40,.6),inset 0 0 40px rgba(255,200,100,.7);
  pointer-events:none;animation:shock 1.1s cubic-bezier(.1,.7,.2,1) forwards}
.shock.two{animation-delay:.12s;border-color:rgba(255,120,60,.8)}
@keyframes shock{from{transform:scale(.2);opacity:1}to{transform:scale(60);opacity:0}}
.quake{animation:quake .7s linear}
@keyframes quake{
  0%,100%{transform:translate(0,0)}10%{transform:translate(-14px,8px)}20%{transform:translate(12px,-10px)}
  30%{transform:translate(-10px,-6px)}40%{transform:translate(9px,9px)}50%{transform:translate(-6px,4px)}
  60%{transform:translate(5px,-5px)}80%{transform:translate(-3px,2px)}}

/* ---------- Stage 2 : wishes ---------- */
#stage2{
  padding-block:92px 150px;display:grid;justify-items:center;align-content:center;gap:clamp(18px,3.2vh,34px);text-align:center;
}
#stage2[hidden]{display:none}
.logo-card{
  position:relative;width:min(760px,100%);
  opacity:0;transform:translateY(24px) scale(.94);
}
.logo-card img{display:block;width:100%;height:auto;
  filter:drop-shadow(0 0 14px rgba(255,170,60,.45)) drop-shadow(0 0 46px rgba(255,110,30,.3))}
.show .logo-card{animation:cardIn 1.2s cubic-bezier(.2,.9,.3,1) .2s forwards,cardGlow 3.4s ease-in-out 1.6s infinite}
@keyframes cardIn{to{opacity:1;transform:none}}
@keyframes cardGlow{50%{filter:brightness(1.12)}}

#msg{position:relative;width:min(760px,100%);display:grid;gap:18px;justify-items:center}
h1{
  margin:0;font-family:var(--font-display);font-weight:900;line-height:1.18;text-wrap:balance;
  font-size:clamp(27px,5.6vw,56px);filter:drop-shadow(0 0 18px rgba(255,150,40,.55));
}
h1 .em{display:inline-block;opacity:0;transform:scale(.3)}
.show h1 .em{animation:emIn .9s cubic-bezier(.2,1.6,.4,1) .9s forwards,emFlick 1.6s ease-in-out 2s infinite}
@keyframes emIn{to{opacity:1;transform:scale(1)}}
@keyframes emFlick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(3deg)}}
.w{display:inline-block;opacity:0;transform:translateY(26px) scale(.9);filter:blur(10px)}
h1 .w{
  background:linear-gradient(100deg,#ff9a1f 0%,#ffe08a 25%,#fff6d8 40%,#ffd166 55%,#ff8a1f 80%,#ff5a2a 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.show h1 .w{animation:wIn .9s cubic-bezier(.2,.9,.3,1) forwards,shimmer 4s linear 2s infinite;animation-delay:var(--d),calc(var(--d) + 1.2s)}
.show p .w{animation:wIn .8s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:var(--d)}
@keyframes wIn{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:-260% 0}}
#msg p{
  margin:0;max-width:44em;font-weight:300;line-height:1.7;color:var(--cream);
  font-size:clamp(15px,2.3vw,21px);text-shadow:0 0 14px rgba(255,150,60,.35);text-wrap:pretty;
}
.spk{position:absolute;color:var(--gold);pointer-events:none;opacity:0;font-size:14px;text-shadow:0 0 10px #ffb347}
.show .spk{animation:twinkle var(--t) ease-in-out var(--sd) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}

/* bulbs */
#bulbs{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:80px;z-index:4;pointer-events:none;opacity:0;transform:translateY(-30px);transition:opacity 1s ease .3s,transform 1s ease .3s}
body.lit #bulbs{opacity:1;transform:none}
#bulbs svg{position:absolute;inset:0;width:100%;height:100%}
#bulbs i{position:absolute;width:13px;height:18px;margin-left:-6.5px;border-radius:50% 50% 45% 45%/40% 40% 60% 60%;
  background:radial-gradient(circle at 40% 30%,#fff 0,var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000) 100%);
  box-shadow:0 0 10px 3px var(--c),0 0 26px 8px color-mix(in srgb,var(--c) 45%,transparent);
  animation:bulb 1.8s ease-in-out infinite;animation-delay:var(--bd)}
@keyframes bulb{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.35;filter:brightness(.7)}}

/* diyas */
#diyas{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;justify-content:space-evenly;align-items:flex-end;
  padding:0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;opacity:0;transform:translateY(30px);transition:opacity 1.2s ease 1s,transform 1.2s ease 1s}
body.lit #diyas{opacity:1;transform:none}
.diya{position:relative;width:var(--s);height:calc(var(--s)*.46)}
.diya .bowl{position:absolute;inset:0;border-radius:6% 6% 100% 100%/8% 8% 100% 100%;
  background:linear-gradient(180deg,#f08a3c 0,#c4531c 45%,#6e220b 100%);box-shadow:0 8px 26px rgba(255,120,30,.5)}
.diya .bowl::before{content:"";position:absolute;left:3%;right:3%;top:-14%;height:34%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,#ffb347 0,#7a2a08 70%);box-shadow:inset 0 -2px 6px rgba(0,0,0,.4)}
.diya .flame{position:absolute;left:50%;bottom:calc(100% - 4px);width:calc(var(--s)*.2);height:calc(var(--s)*.42);margin-left:calc(var(--s)*-.1);
  border-radius:50% 50% 50% 50%/72% 72% 28% 28%;
  background:radial-gradient(ellipse at 50% 82%,#fffbe8 0,#ffd75a 32%,#ff8a1f 66%,rgba(255,60,0,0) 100%);
  box-shadow:0 0 22px 8px rgba(255,170,50,.6),0 0 60px 22px rgba(255,110,20,.3);
  transform-origin:50% 100%;animation:flicker var(--f) ease-in-out infinite alternate}
@keyframes flicker{
  0%{transform:scale(1,1) skewX(-3deg);opacity:.95}25%{transform:scale(.92,1.08) skewX(4deg)}
  55%{transform:scale(1.06,.94) skewX(-2deg);opacity:1}100%{transform:scale(.95,1.1) skewX(3deg);opacity:.9}}

/* tiny, low-key controls */
#credit{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:6;
  font-size:10px;letter-spacing:.12em;color:rgba(255,233,199,.3);pointer-events:none;user-select:none}
.ctl{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:6px}
.ctl button{appearance:none;border:0;background:rgba(255,255,255,.06);color:rgba(255,233,199,.5);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.ctl button:hover{background:rgba(255,255,255,.14);color:var(--cream)}
.ctl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#replayBtn[hidden]{display:none}

@media (max-width:520px){
  #stage2{padding-block:84px 130px}
}
@media (prefers-reduced-motion:reduce){
  .quake{animation:none}.logo-card::after{animation:none}
}

/* sparkler (fuljhuri) cursor */
#fx2{position:fixed;inset:0;width:100%;height:100%;z-index:29;pointer-events:none}
#sparkler{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
#sparkler.on{opacity:1}
#sparkler .rod{position:absolute;left:-1.5px;top:0;width:3px;height:104px;border-radius:2px;transform-origin:50% 0;transform:rotate(30deg);
  background:linear-gradient(to bottom,#fff2c4 0,#ff9a1f 5px,#2b2a31 12px,#2b2a31 46px,#c2c2ce 48px,#80808c 100%);box-shadow:0 0 6px rgba(255,160,50,.35)}
#sparkler .tip{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,#fff 0,#ffeaa8 24%,rgba(255,170,50,.7) 50%,rgba(255,120,20,0) 72%);animation:tipFlick .11s steps(2,end) infinite alternate}
@keyframes tipFlick{to{transform:scale(1.4);opacity:.8}}
@media (hover:hover) and (pointer:fine){html,body,body *{cursor:none !important}}
</style>

<div id="alarm"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="bulbs" aria-hidden="true"></div>

<main id="root">
  <section id="stage1" class="scene">
    <div id="bombWrap">
      <svg id="bomb" viewBox="0 0 300 340" role="img" aria-label="Time bomb showing a six second timer">
        <defs>

            <stop offset="0" stop-color="#2b2b35"/><stop offset=".35" stop-color="#7d7d8c"/><stop offset=".6" stop-color="#3a3a46"/><stop offset="1" stop-color="#17171e"/>
          </linearGradient>
          <radialGradient id="gSpark"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".25" stop-color="#ffd166" stop-opacity=".95"/><stop offset=".6" stop-color="#ff6a00" stop-opacity=".4"/><stop offset="1" stop-color="#ff3b2e" stop-opacity="0"/></radialGradient>
          <filter id="fGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <rect x="68" y="158" width="164" height="92" rx="12" fill="#14141b" stroke="#41414f" stroke-width="2"/>
        <circle cx="76" cy="166" r="2.4" fill="#5b5b6b"/><circle cx="224" cy="166" r="2.4" fill="#5b5b6b"/>
        <circle cx="76" cy="242" r="2.4" fill="#5b5b6b"/><circle cx="224" cy="242" r="2.4" fill="#5b5b6b"/>
        <rect x="82" y="172" width="136" height="64" rx="7" fill="#110605" stroke="#2c1812"/>
        <text x="150" y="222" text-anchor="middle" font-family="Orbitron,'Courier New',monospace" font-weight="900" font-size="50" fill="#ff3b2e" opacity=".08">88</text>
        <text id="digits" x="150" y="222" text-anchor="middle" font-family="Orbitron,'Courier New',monospace" font-weight="900" font-size="50" fill="#ffb02e" filter="url(#fGlow)">06</text>
        <circle class="led" cx="92" cy="182" r="3.2" fill="#ff3b2e"/>
        <circle class="led" cx="208" cy="182" r="3.2" fill="#ff3b2e" style="animation-delay:.4s"/>
        <g id="spark" opacity="0" transform="translate(216 24)">
          <circle r="17" fill="url(#gSpark)"/><circle r="3.4" fill="#fff"/>
        </g>
      </svg>
    </div>
    <button id="startBtn" type="button">Start countdown</button>
  </section>

      master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*1.6,AC.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){AC=null}
  }
  function beep(f,dur,vol,type){
    if(!AC)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
  }
  function boom(){
    if(!AC)return;var t=AC.currentTime;
    var n=AC.createBufferSource();n.buffer=noiseBuf;var lp=AC.createBiquadFilter();lp.type='lowpass';
    lp.frequency.setValueAtTime(2400,t);lp.frequency.exponentialRampToValueAtTime(60,t+1.3);
    var g=AC.createGain();g.gain.setValueAtTime(1.2,t);g.gain.exponentialRampToValueAtTime(.001,t+1.5);
    n.connect(lp);lp.connect(g);g.connect(master);n.start(t);n.stop(t+1.55);
    var o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(28,t+.9);
    og.gain.setValueAtTime(1.4,t);og.gain.exponentialRampToValueAtTime(.001,t+1);o.connect(og);og.connect(master);o.start(t);o.stop(t+1.05);
  }
  function pop(vol){
    if(!AC)return;var now=performance.now();if(now-lastPop<90)return;lastPop=now;
    var t=AC.currentTime,n=AC.createBufferSource();n.buffer=noiseBuf;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700+Math.random()*2200;bp.Q.value=.8;
    var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
    n.connect(bp);bp.connect(g);g.connect(master);n.start(t,Math.random()*1.2);n.stop(t+.3);
  }
  $('muteBtn').addEventListener('click',function(){
    muted=!muted;this.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.8;
  });

  /* ---------- particles ---------- */
  var parts=[],rockets=[],COLS=['#ffd166','#ff8a1f','#ff4d4d','#ff5fa2','#b967ff','#4de1ff','#6bff95','#ffffff'];
  function rnd(a,b){return a+Math.random()*(b-a)}
  function sc(){return Math.max(.6,Math.min(1.35,Math.min(W,H)/700))}
  function addP(x,y,vx,vy,col,life,size,g,drag,tw){parts.push({x:x,y:y,vx:vx,vy:vy,col:col,life:life,max:life,size:size,g:g,drag:drag,tw:tw})}
  function burst(x,y,type,col,loud){
    var s=sc(),n,i,a,sp,c2=COLS[Math.floor(Math.random()*COLS.length)];
    col=col||COLS[Math.floor(Math.random()*(COLS.length-1))];
    if(type==='ring'){n=Math.round(64*s+20);for(i=0;i<n;i++){a=i/n*Math.PI*2;sp=5.4*s;addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,col,rnd(62,82),2,.04,.985,false)}}
    else if(type==='willow'){n=Math.round(90*s+20);for(i=0;i<n;i++){a=Math.random()*Math.PI*2;sp=rnd(1.5,6.2)*s;addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,'#ffcf6b',rnd(120,170),1.8,.03,.976,true)}}
    else{n=Math.round(110*s+20);for(i=0;i<n;i++){a=Math.random()*Math.PI*2;sp=(.3+Math.random()*.7)*7.2*s;addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,Math.random()<.35?c2:col,rnd(55,95),rnd(1.6,2.6),.045,.985,Math.random()<.3)}}
    if(loud!==false)pop(.35);
  }
  function launch(){
    var s=sc();
    rockets.push({x:rnd(W*.1,W*.9),y:H+10,vx:rnd(-.6,.6),vy:-rnd(8.5,12)*s,ty:rnd(H*.1,H*.46),
      type:['radial','radial','ring','willow'][Math.floor(Math.random()*4)]});
  }
  var launchT=null;
  function launchLoop(){
    if(state!=='done')return;
    launch();if(Math.random()<.35)setTimeout(launch,160);
    launchT=setTimeout(launchLoop,rnd(480,1050));
  }


  /* ---------- sparkler cursor ---------- */
  var sk=$('sparkler'),cur={x:-200,y:-200,vx:0,vy:0,on:false},sp=[],offT=null;
  function curMove(e){
    var touch=e.pointerType==='touch';
    if(touch&&e.type==='pointermove'&&!cur.on)return;
    cur.vx=(e.clientX-cur.x)*.35;cur.vy=(e.clientY-cur.y)*.35;
    cur.x=e.clientX;cur.y=e.clientY;cur.on=true;clearTimeout(offT);
    sk.style.transform='translate3d('+cur.x+'px,'+cur.y+'px,0)';sk.classList.add('on');
  }
  function curOff(delay){clearTimeout(offT);offT=setTimeout(function(){cur.on=false;sk.classList.remove('on')},delay||0)}
  addEventListener('pointermove',curMove,{passive:true});
  addEventListener('pointerdown',function(e){curMove(e)},{passive:true});
  addEventListener('pointerup',function(e){if(e.pointerType==='touch')curOff(600)},{passive:true});
  addEventListener('pointercancel',function(){curOff(200)},{passive:true});
  document.documentElement.addEventListener('mouseleave',function(){curOff(0)});
  var SPC=['#ffffff','#fff1b8','#ffd166','#ffb347','#ffffff'];
  function sparkStep(dt){
    ctx2.globalCompositeOperation='destination-out';
    ctx2.fillStyle='rgba(0,0,0,'+Math.min(.6,.35*dt)+')';ctx2.fillRect(0,0,W,H);
    ctx2.globalCompositeOperation='lighter';
    if(cur.on){
      for(var i=0;i<6;i++){
        var a=Math.random()*6.2832,v=rnd(1.2,7);
        sp.push({x:cur.x,y:cur.y,vx:Math.cos(a)*v+cur.vx*.4,vy:Math.sin(a)*v+cur.vy*.4-.4,life:rnd(10,30),max:30,c:SPC[Math.floor(Math.random()*SPC.length)],w:rnd(.7,1.7)});
      }
      cur.vx*=.8;cur.vy*=.8;
    }
    ctx2.lineCap='round';
    for(var j=sp.length-1;j>=0;j--){
      var p=sp[j];p.vx*=Math.pow(.93,dt);p.vy*=Math.pow(.93,dt);p.vy+=.12*dt;
      var nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;p.life-=dt;
      if(p.life<=0){sp.splice(j,1);continue}
      ctx2.globalAlpha=Math.min(1,p.life/14);ctx2.strokeStyle=p.c;ctx2.lineWidth=p.w;
      ctx2.beginPath();ctx2.moveTo(p.x-p.vx*.9,p.y-p.vy*.9);ctx2.lineTo(nx,ny);ctx2.stroke();
      p.x=nx;p.y=ny;
    }
    if(sp.length>900)sp.splice(0,sp.length-900);
    ctx2.globalAlpha=1;
  }
  /* ---------- state ---------- */
  var state='idle',t0=0,lastShown=6,fuseLen=0,waitT=null,revealT=null,t1=null;
  var fuse=$('fuse'),spark=$('spark'),digits=$('digits'),wrap=$('bombWrap'),alarm=$('alarm'),startBtn=$('startBtn');
  fuseLen=fuse.getTotalLength();
  function pad(n){return(n<10?'0':'')+n}
  function setDigits(n){
    digits.textContent=pad(n);
    digits.setAttribute('fill',n<=2?'#ff2a1a':n<=4?'#ff7a26':'#ffb02e');
  }

  startBtn.addEventListener('click',function(){
    if(state!=='idle')return;
    initAudio();state='run';t0=performance.now();lastShown=6;
    startBtn.classList.add('off');$('stage1').classList.add('running');
    spark.setAttribute('opacity','1');beep(900,.09,.18);
  });

  function explode(){
    state='boom';
    var r=wrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.6;
    wrap.classList.add('boomed');wrap.style.filter='none';alarm.style.opacity=0;
    boom();
    if(!RM){var f=$('flash');f.className='go';requestAnimationFrame(function(){requestAnimationFrame(function(){f.className='fade'})});
      $('root').classList.add('quake');setTimeout(function(){$('root').classList.remove('quake')},750)}
    for(var k=0;k<2;k++){var sh=document.createElement('div');sh.className='shock'+(k?' two':'');sh.style.left=cx+'px';sh.style.top=cy+'px';document.body.appendChild(sh);setTimeout(function(e){return function(){e.remove()}}(sh),1300)}
    for(var i=0;i<320;i++){var a=Math.random()*Math.PI*2,sp=Math.pow(Math.random(),.6)*17;
      addP(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp,['#fff3c4','#ffd166','#ff8a1f','#ff3b2e'][Math.floor(Math.random()*4)],rnd(40,110),rnd(1.5,4),.12,.96,Math.random()<.4)}
    setTimeout(function(){burst(cx,cy,'ring','#ffd166',false)},150);
    setTimeout(function(){burst(W*.25,H*.3,'radial','#ff5fa2')},450);
    setTimeout(function(){burst(W*.75,H*.28,'radial','#4de1ff')},650);
    setTimeout(function(){burst(W*.5,H*.2,'willow','#ffd166')},900);
    revealT=setTimeout(reveal,1000);
  }

  function split(el,start,step){
    var words=el.textContent.trim().split(/\s+/);el.textContent='';
    words.forEach(function(w,i){var s=document.createElement('span');s.className='w';s.style.setProperty('--d',(start+i*step).toFixed(2)+'s');s.textContent=w;el.appendChild(s);if(i<words.length-1)el.appendChild(document.createTextNode(' '))});
  }
  var origText={};
  ['hl','p1','p2'].forEach(function(id){origText[id]=$(id).textContent});

  function buildBulbs(){
    var box=$('bulbs');box.innerHTML='';
    var step=Math.max(30,W/Math.round(W/40)),swag=step*5,sag=18,pts='',cols=['#ff5a3c','#ffd166','#ff9a1f','#ff5fa2','#6bff95','#4de1ff'];
    function yAt(x){var u=(x%swag)/swag;return 8+sag*4*u*(1-u)}
    for(var x=0;x<=W+6;x+=6)pts+=(x?'L':'M')+x+' '+yAt(x).toFixed(1)+' ';
    var svg='<svg viewBox="0 0 '+W+' 80" preserveAspectRatio="none"><path d="'+pts+'" fill="none" stroke="#3b2a1c" stroke-width="2"/></svg>';
    var html=svg,i=0;
    for(var bx=step/2;bx<W;bx+=step,i++){
      html+='<i style="left:'+bx+'px;top:'+(yAt(bx)+1).toFixed(1)+'px;--c:'+cols[i%cols.length]+';--bd:'+(i*.23%1.8).toFixed(2)+'s"></i>';
    }
    box.innerHTML=html;
  }
  function buildDiyas(){
    var box=$('diyas');box.innerHTML='';
    var n=W<480?5:W<900?7:11,h='';
    for(var i=0;i<n;i++){
      var big=i%2===0,s=Math.round((W<480?46:big?64:52)*(W<480&&big?1.12:1));
      h+='<div class="diya" style="--s:'+s+'px;--f:'+(.35+Math.random()*.4).toFixed(2)+'s"><div class="bowl"></div><div class="flame"></div></div>';
    }
    box.innerHTML=h;
  }
  function sparkles(){
    var m=$('msg');m.querySelectorAll('.spk').forEach(function(e){e.remove()});
    for(var i=0;i<14;i++){
      var s=document.createElement('span');s.className='spk';s.textContent=Math.random()<.5?'✦':'✧';
      s.style.left=rnd(-4,100)+'%';s.style.top=rnd(-18,108)+'%';s.style.fontSize=rnd(10,22)+'px';
      s.style.setProperty('--t',rnd(1.6,3.2).toFixed(2)+'s');s.style.setProperty('--sd',rnd(1.5,5).toFixed(2)+'s');m.appendChild(s);
    }
  }
  function reveal(){
    $('stage1').classList.add('gone');
    t1=setTimeout(function(){$('stage1').hidden=true},700);
    ['hl','p1','p2'].forEach(function(id){$(id).textContent=origText[id]});
    split($('hl'),.9,.14);split($('p1'),2.4,.05);split($('p2'),4.1,.05);
    $('stage2').hidden=false;sparkles();buildBulbs();buildDiyas();
    document.body.classList.add('lit');
    void $('stage2').offsetWidth;
    $('stage2').classList.add('show');
    state='done';$('replayBtn').hidden=false;
    launchLoop();
  }

  function reset(){
    state='idle';clearTimeout(launchT);clearTimeout(revealT);clearTimeout(t1);
    parts.length=0;rockets.length=0;
    document.body.classList.remove('lit');$('stage2').classList.remove('show');$('stage2').hidden=true;
    var s1=$('stage1');s1.hidden=false;s1.classList.remove('gone','running');
    void s1.offsetWidth;
    wrap.classList.remove('boomed');wrap.style.transform='';wrap.style.filter='';
    setDigits(6);spark.setAttribute('opacity','0');
    fuse.style.strokeDasharray='';alarm.style.opacity=0;
    startBtn.classList.remove('off');$('replayBtn').hidden=true;
  }
  $('replayBtn').addEventListener('click',reset);

  /* ---------- main loop ---------- */
  var last=performance.now();
  function frame(now){
    var dt=Math.min(40,now-last)/16.667;last=now;
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle='rgba(0,0,0,'+Math.min(.5,.2*dt)+')';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';

    if(state==='run'){
      var el=(now-t0)/1000,p=Math.min(1,el/6),rem=6-el,shown=Math.max(0,Math.ceil(rem));
      if(shown!==lastShown){lastShown=shown;setDigits(shown);
        if(shown>0)beep(shown<=2?1250:820,.09,.2);}
      var remLen=fuseLen*(1-p);
      fuse.style.strokeDasharray=remLen+' '+(fuseLen+10);
      var pt=fuse.getPointAtLength(Math.max(0,remLen));
      spark.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+')');
      spark.setAttribute('opacity',(.75+Math.random()*.25).toFixed(2));
      var sr=spark.getBoundingClientRect(),sx=sr.left+sr.width/2,sy=sr.top+sr.height/2;
      for(var k=0;k<3;k++)addP(sx,sy,rnd(-1.6,1.6),rnd(-2.6,-.4),Math.random()<.5?'#ffd166':'#ff8a1f',rnd(18,40),rnd(1,2),.12,.97,true);
      var amp=RM?0:Math.pow(p,2.2)*8,rot=RM?0:Math.pow(p,2.2)*2.4;
      wrap.style.transform='translate('+rnd(-amp,amp).toFixed(2)+'px,'+rnd(-amp,amp).toFixed(2)+'px) rotate('+rnd(-rot,rot).toFixed(2)+'deg)';
      wrap.style.filter='drop-shadow(0 0 '+(8+p*34).toFixed(0)+'px rgba(255,'+Math.round(90-p*50)+',30,'+(.15+p*.6).toFixed(2)+'))';
      var beat=.5+.5*Math.sin(el*(4+p*16));alarm.style.opacity=(p*.9*(.35+.65*beat)).toFixed(3);
      if(el>=6){
        state='wait';setDigits(0);digits.textContent='00';
        spark.setAttribute('opacity','0');beep(1500,.4,.25);
        waitT=setTimeout(explode,420);
      }
    }

    /* anar fountains + embers while the celebration runs */
    if(state==='done'||state==='boom'){
      var tt=(now/1000)%7,on=tt<3.2||(tt>3.6&&tt<5.6&&false);
      var fy=H-70-(W<600?30:0);
      if(state==='done'&&on){
        [W*.1,W*.9].forEach(function(fx,idx){
          for(var q=0;q<5;q++)addP(fx+rnd(-6,6),fy,rnd(-1.8,1.8)+(idx?-.4:.4),-rnd(7,12)*sc(),Math.random()<.5?'#ffd166':'#ff8a1f',rnd(26,48),rnd(1.2,2.2),.2,.98,true);
        });
        if(Math.random()<.05)pop(.12);
      }
      if(state==='done'&&Math.random()<.35)addP(rnd(0,W),H+4,rnd(-.3,.3),-rnd(.5,1.4),'#ffb347',rnd(160,260),rnd(1,1.8),-.004,.995,true);
    }

    for(var i=rockets.length-1;i>=0;i--){
      var r=rockets[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy*=Math.pow(.992,dt);
      addP(r.x,r.y,rnd(-.3,.3),rnd(.2,1),'#ffe2a8',rnd(12,22),1.5,.02,.95,false);
      if(r.y<=r.ty){burst(r.x,r.y,r.type);rockets.splice(i,1)}
    }
    for(var j=parts.length-1;j>=0;j--){
      var q=parts[j];q.vx*=Math.pow(q.drag,dt);q.vy*=Math.pow(q.drag,dt);q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
      if(q.life<=0){parts.splice(j,1);continue}
      var al=q.life/q.max;if(q.tw&&Math.random()<.35)al*=.25;
      ctx.globalAlpha=Math.max(0,Math.min(1,al*1.3));ctx.fillStyle=q.col;
      ctx.beginPath();ctx.arc(q.x,q.y,q.size*(.5+al*.6),0,6.2832);ctx.fill();
    }
    if(parts.length>2600)parts.splice(0,parts.length-2600);
    ctx.globalAlpha=1;
    sparkStep(dt);
    requestAnimationFrame(frame);
  }
  setDigits(6);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
